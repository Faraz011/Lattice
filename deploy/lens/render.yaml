# Lattice Lens on Render: one free web service. Kept apart from the root render.yaml, which
# deploys the whole AML stack on paid plans. In Render: New > Blueprint, pick this repository,
# and set the blueprint path to deploy/lens/render.yaml. See docs/two-device-demo.md.

services:
  - type: web
    name: lattice-lens
    runtime: docker
    plan: free  # sleeps after 15 minutes idle; open it a minute before the demo
    dockerfilePath: ./Dockerfile.lens
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Free Cesium ion token for Google's photorealistic 3D London (ion.cesium.com > Access
      # Tokens). Set it in the Render dashboard; without it the car drives on the open map.
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
      # Google Maps key with the Map Tiles API enabled, restricted to this site's address: the
      # car's cameras show Google Street View. Without it they show the 3D city.
      - key: VITE_GOOGLE_MAPS_KEY
        sync: false
